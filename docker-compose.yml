services:
  backend:
    image: fammadocker/warm-order-hub-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: warm-order-hub-backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    image: fammadocker/warm-order-hub-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # For "separate URL" deployment, set VITE_API_URL like http://<EC2_PUBLIC_IP>:8080
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: warm-order-hub-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
