name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE_BACKEND: warm-order-hub-backend
  DOCKER_IMAGE_FRONTEND: warm-order-hub-frontend

jobs:
  # ─── Job 1: Lint & Build ───
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint -w frontend

      - name: Build backend
        run: npm run build -w backend

      - name: Build frontend
        run: npm run build -w frontend

  # ─── Job 2: Build Docker Images ───
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE_BACKEND }}:latest ./backend

      - name: Build frontend Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE_FRONTEND }}:latest ./frontend

      - name: Verify Docker images
        run: |
          docker images | grep warm-order-hub

  # ─── Job 3: Deploy to EC2 (only on push to main) ───
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ".,!node_modules,!.git"
          target: /home/${{ secrets.EC2_USER }}/warm-order-hub

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/warm-order-hub
            docker compose down || true
            docker compose up -d --build
            docker ps
